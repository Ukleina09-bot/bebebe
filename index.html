<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для моей Илюшности</title>
    <style>
        /* Финальное окно */
#finalModal {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #2a0a0a;
    border: 2px solid #ff0055;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    z-index: 1000;
    box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
    width: 280px;
}
#finalModal h2 { font-size: 20px; margin-bottom: 20px; color: white; }
.modal-btns { display: flex; flex-direction: column; gap: 10px; }
.m-btn {
    padding: 12px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}
.yes-btn { background: #ff0055; color: white; }
.no-btn { background: #444; color: #999; position: relative; }

 body {
            background-color: #1a0505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        <div id="finalModal">
    <h2>ну наконец-то поймал! С тебя миллион поцелуев минимум 💋</h2>
    <div class="modal-btns">
        <button class="m-btn yes-btn" onclick="alert('буду ждать, люблю тебя мой котёночек ♥️')">Хорошо, моя любимая</button>
        <button class="m-btn no-btn" id="noButton">Отказаться</button>
    </div>


        .shake-active { animation: shake 0.1s infinite; }
        @keyframes shake {
            0% { transform: translate(3px, 3px); }
            50% { transform: translate(-3px, -2px); }
            100% { transform: translate(3px, -2px); }
        }

        /* ТЕ САМЫЕ ЛЕПЕСТКИ */
        .background-petal {
            position: absolute;
            top: -50px;
            pointer-events: none;
            z-index: 1;
            background: #ffb7c5; 
            border-radius: 154% 0 154% 0;
            opacity: 0.7;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        #main-card {
            border: 2px solid #ff0055;
            border-radius: 40px;
            padding: 40px 20px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.2);
            z-index: 10;
        }

        .from-to { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .for-whom { font-size: 18px; color: #ff99bb; margin-bottom: 40px; }
        
        .start-btn {
            background-color: #ff0055;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            z-index: 20;
        }

        #chaos-container {
            display: none;
            position: absolute;
            width: 100%; height: 100%;
            justify-content: center; align-items: center;
            z-index: 50;
        }

        .text {
            font-size: 45px; color: #ff2d55; font-weight: bold; text-align: center;
            animation: attack 1.5s infinite ease-in-out;
        }

        @keyframes attack {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(3.5) rotate(-60deg); }
            50% { transform: scale(1) rotate(0deg); }
            75% { transform: scale(3.5) rotate(60deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .explosion-sticker {
            position: absolute;
            top: 50%; left: 50%;
            pointer-events: none;
            z-index: 60;
            animation: explode 1.5s forwards ease-out;
        }

        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(2.5) rotate(var(--tr)); opacity: 0; }
        }

        #runBtn {
            display: none; opacity: 0;
            position: absolute; padding: 15px 30px;
            background-color: #ff0055; color: white;
            border: none; border-radius: 50px;
            font-size: 18px; cursor: pointer;
            transition: all 0.4s ease;
            z-index: 100; touch-action: none;
        }
    </style>
</head>
<body>

    <div id="main-card">
        <div class="from-to">От: Tochnonecawa</div>
        <div class="for-whom">Для: любимости</div>
        <button class="start-btn" id="goBtn">Нажми сюда, бусинка</button>
    </div>

    <div id="chaos-container">
        <div class="text">ты мой мир ♥️</div>
    </div>

    <button id="runBtn">хочу поцелуев</button>

    <script>
        // 1. Лепестки на фоне (сразу)
        function createPetal() {
            const p = document.createElement('div');
            p.className = 'background-petal';
            p.style.width = (Math.random() * 10 + 5) + 'px';
            p.style.height = (Math.random() * 10 + 15) + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.opacity = Math.random() * 0.6 + 0.2;
            p.style.animationDuration = (Math.random() * 3 + 5) + 's';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 8000);
        }
        setInterval(createPetal, 400);

        const body = document.body;
        const card = document.getElementById('main-card');
        const chaos = document.getElementById('chaos-container');
        const runBtn = document.getElementById('runBtn');
        const goBtn = document.getElementById('goBtn');
        let jumpCount = 0;

        // 2. Логика по клику на "бусинку"
        goBtn.addEventListener('click', () => {
            card.style.display = 'none';
            body.classList.add('shake-active');
            chaos.style.display = 'flex';

            // МЯСО ИЗ СТИКЕРОВ (увеличил в 10 раз по просьбе)
            const stickerInterval = setInterval(() => {
                for (let i = 0; i < 6; i++) { // Сразу пачкой по 6 штук
                    const s = document.createElement('div');
                    s.className = 'explosion-sticker';
                    s.innerHTML = ['❤️','♥️','💋','❤️','🌸'][Math.floor(Math.random()*5)];
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 300 + Math.random() * 600;
                    s.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                    s.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                    s.style.setProperty('--tr', Math.random() * 360 + 'deg');
                    document.body.appendChild(s);
                    setTimeout(() => s.remove(), 1500);
                }
            }, 60);

            setTimeout(() => {
                clearInterval(stickerInterval);
                chaos.style.opacity = '0';
                body.classList.remove('shake-active');
                setTimeout(() => {
                    chaos.style.display = 'none';
                    runBtn.style.display = 'block';
                    setTimeout(() => { runBtn.style.opacity = '1'; moveBtn(); }, 100);
                }, 1500);
            }, 5000);
        });

        function moveBtn() {
            if (jumpCount < 10) {
                const x = Math.random() * (window.innerWidth - runBtn.clientWidth);
                const y = Math.random() * (window.innerHeight - runBtn.clientHeight);
                runBtn.style.left = x + 'px';
                runBtn.style.top = y + 'px';
                jumpCount++;
            }
        }

        runBtn.addEventListener('touchstart', (e) => { 
            if(jumpCount < 10) { 
                e.preventDefault(); 
                moveBtn(); 
            } 
        });

        runBtn.addEventListener('mouseover', () => { 
            if(jumpCount < 10) moveBtn(); 
        });
        
        runBtn.addEventListener('click', () => {
            // Окно откроется только если кнопка прыгнула 10 раз
            if (jumpCount >= 10) {
                runBtn.style.display = 'none';
                modal.style.display = 'block';
            }
        });

        noBtn.addEventListener('mouseover', () => {
            noBtn.innerText = 'Я ДУРАК'; 
            setTimeout(() => { 
                noBtn.innerText = 'ОЙ, ХОРОШО!'; 
                noBtn.style.background = '#ff0055'; 
                noBtn.style.color = 'white'; 
            }, 1000);
        });

        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            noBtn.innerText = 'НЕЛЬЗЯ!';
            setTimeout(() => { 
                noBtn.style.background = '#ff0055'; 
                noBtn.innerText = 'ЖМИ ЛЕВУЮ!'; 
            }, 500);
        });
    </script>
</body>
