<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для моей Илюшности</title>
    <style>.background-petal {
    position: absolute;
    top: -50px;
    pointer-events: none;
    z-index: 1;
    /* Вместо смайлика делаем розовый нежный овал */
    background: #ffb7c5; 
    border-radius: 150% 0 150% 0; /* Форма лепестка */
    opacity: 0.7;
    animation: fall linear forwards;
}
@keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
}
        body {
            background-color: #1a0505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        /* Тряска фона */
        .shake-active { animation: shake 0.1s infinite; }
        @keyframes shake {
            0% { transform: translate(3px, 3px); }
            50% { transform: translate(-3px, -2px); }
            100% { transform: translate(3px, -2px); }
        }

        /* КАРТОЧКА №1 */
        #main-card {
            border: 2px solid #ff0055;
            border-radius: 40px;
            padding: 40px 20px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.2);
            z-index: 10;
        }

        .from-to { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .for-whom { font-size: 18px; color: #ff99bb; margin-bottom: 40px; }
        
        .start-btn {
            background-color: #ff0055;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
        }

        /* ХАОС (Надпись) */
        #chaos-container {
            display: none;
            position: absolute;
            width: 100%; height: 100%;
            justify-content: center; align-items: center;
            transition: opacity 1.5s ease;
            pointer-events: none;
        }

        .text {
            font-size: 45px; color: #ff2d55; font-weight: bold; text-align: center;
            animation: attack 1.5s infinite ease-in-out;
            z-index: 50;
        }

        @keyframes attack {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(3) rotate(-60deg); }
            50% { transform: scale(1) rotate(0deg); }
            75% { transform: scale(3) rotate(60deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* СТИКЕРЫ ИЗ ЦЕНТРА */
        .explosion-sticker {
            position: absolute;
            top: 50%; left: 50%;
            font-size: 30px;
            pointer-events: none;
            z-index: 5;
            animation: explode 1.5s forwards ease-out;
        }

        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(2.5) rotate(var(--tr)); opacity: 0; }
        }

        /* УБЕГАЮЩАЯ КНОПКА */
        #runBtn {
            display: none; opacity: 0;
            position: absolute; padding: 15px 30px;
            background-color: #ff0055; color: white;
            border: none; border-radius: 50px;
            font-size: 18px; cursor: pointer;
            transition: all 0.4s ease;
            z-index: 100; touch-action: none;
        }
    </style>
</head>
<body id="mainBody">

    <!-- ПЕРВЫЙ ЭКРАН -->
    <div id="main-card">
        <div class="from-to">От: Tochnonecawa</div>
        <div class="for-whom">Для: любимости</div>
        <button class="start-btn" id="goBtn">Нажми сюда, бусинка</button>
    </div>

    <!-- ТРЭШ ЭКРАН -->
    <div id="chaos-container">
        <div class="text">Ты мой мир ♥️</div>
    </div>

    <!-- ФИНАЛ -->
    <button id="runBtn">хочу поцелуев</button>

    <script>
       function createPetal() {
    const p = document.createElement('div');
    p.className = 'background-petal';
    // Смайлик УДАЛЯЕМ, оставляем пустой блок, форма будет из CSS
    p.style.width = (Math.random() * 10 + 5) + 'px'; // Размер лепестка
    p.style.height = (Math.random() * 10 + 15) + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.opacity = Math.random() * 0.6 + 0.2;
    p.style.animationDuration = (Math.random() * 3 + 5) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 8000);

// Запускаем создание лепестков каждые 400 миллисекунд
setInterval(createPetal, 400);
        const body = document.getElementById('mainBody');
        const card = document.getElementById('main-card');
        const chaos = document.getElementById('chaos-container');
        const runBtn = document.getElementById('runBtn');
        let jumpCount = 0;

        document.getElementById('goBtn').addEventListener('click', () => {
            card.style.display = 'none';
            body.classList.add('shake-active');
            chaos.style.display = 'flex';

            // Функция взрыва стикеров
            const stickerInterval = setInterval(() => {
                const s = document.createElement('div');
                s.className = 'explosion-sticker';
                s.innerHTML = ['🌸','❤️','❤️','♥️','💋','❤️','❤️','♥️','💋','❤️','♥️','♥️','❤️','♥️','💋','❤️','♥️'][Math.floor(Math.random()*5)];
                
                // Случайное направление полёта
                const angle = Math.random() * Math.PI * 2;
                const dist = 300 + Math.random() * 500;
                const tx = Math.cos(angle) * dist + 'px';
                const ty = Math.sin(angle) * dist + 'px';
                const tr = (Math.random() * 360) + 'deg';
                
                s.style.setProperty('--tx', tx);
                s.style.setProperty('--ty', ty);
                s.style.setProperty('--tr', tr);
                
                document.body.appendChild(s);
                setTimeout(() => s.remove(), 1500);
            }, 100);

            // Финал через 5 сек
            setTimeout(() => {
                clearInterval(stickerInterval);
                chaos.style.opacity = '0';
                body.classList.remove('shake-active');
                
                setTimeout(() => {
                    chaos.style.display = 'none';
                    runBtn.style.display = 'block';
                    setTimeout(() => {
                        runBtn.style.opacity = '1';
                        moveBtn();
                    }, 100);
                }, 1500);
            }, 5000);
        });

        function moveBtn() {
            if (jumpCount < 14) {
                const x = Math.random() * (window.innerWidth - runBtn.clientWidth);
                const y = Math.random() * (window.innerHeight - runBtn.clientHeight);
                runBtn.style.left = x + 'px';
                runBtn.style.top = y + 'px';
                jumpCount++;
            }
        }

        runBtn.addEventListener('touchstart', (e) => { if(jumpCount < 14) { e.preventDefault(); moveBtn(); } });
        runBtn.addEventListener('mouseover', () => { if(jumpCount < 14) moveBtn(); });
        runBtn.addEventListener('click', () => alert('Ну наконец-то поймал! С тебя миллион поцелуев минимум 💋'));
    </script>
</body>
