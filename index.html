<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tochnonecawa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #4a0404 0%, #1a0101 100%);
            color: #ffb7c5;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            text-align: center;
        }
        .content {
            z-index: 2;
            background: rgba(0, 0, 0, 0.6);
            padding: 30px 20px;
            border-radius: 20px;
            border: 1px solid #800020;
            box-shadow: 0 0 30px rgba(128, 0, 32, 0.6);
            backdrop-filter: blur(10px);
            width: 85%;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e30b5c;
            text-shadow: 0 0 10px rgba(227, 11, 92, 0.8);
        }
        p {
            font-size: 1.1rem;
            font-style: italic;
            color: #ffb7c5;
            margin: 5px 0;
        }
        .petal {
            position: absolute;
            top: -10%;
            pointer-events: none;
            animation: fall linear infinite;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
            user-select: none;
        }
        @keyframes fall {
            0% { transform: translateY(0vh) rotate(0deg) translateX(0); }
            100% { transform: translateY(110vh) rotate(360deg) translateX(50px); }
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Tochnonecawa</h1>
        <p>сайт для бусинки</p>
        <p style="font-size: 0.8rem; margin-top: 15px; opacity: 0.5;">est. 67</p>
    </div>
    <script>
        const symbols = ['🌹', '🥀', '🍃', '🌸']; // Твои красивые лепестки
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            petal.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            petal.style.fontSize = Math.random() * 20 + 15 + 'px';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 3 + 5 + 's';
            petal.style.opacity = Math.random() * 0.5 + 0.5;
            document.body.appendChild(petal);
            setTimeout(() => { petal.remove(); }, 8000);
        }
        setInterval(createPetal, 300);
    </script>
</body>
</html>
