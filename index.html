<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tochnonecawa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #4a0404 0%, #1a0101 100%);
            color: #ffb7c5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            text-align: center;
        }
        .content {
            z-index: 2;
            background: rgba(0, 0, 0, 0.5);
            padding: 50px 30px;
            border-radius: 30px;
            border: 2px solid #800020;
            box-shadow: 0 0 50px rgba(128, 0, 32, 0.7);
            backdrop-filter: blur(8px);
            max-width: 80%;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #e30b5c;
            text-shadow: 0 0 15px rgba(227, 11, 92, 0.8);
        }
        p {
            font-size: 1.4rem;
            font-style: italic;
            color: #ffb7c5;
            margin: 0;
        }
        .petal {
            position: absolute;
            top: -10%;
            background-color: #ffb7c5;
            border-radius: 150% 0 150% 0;
            opacity: 0.7;
            pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(0vh) rotate(0deg) translateX(0); }
            100% { transform: translateY(110vh) rotate(720deg) translateX(50px); }
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Tochnonecawa</h1>
        <p>сайт для бусинки</p>
        <p style="font-size: 1rem; margin-top: 15px; opacity: 0.6;">est. 67</p>
    </div>
    <script>
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            const size = Math.random() * 20 + 10 + 'px';
            petal.style.width = size;
            petal.style.height = size;
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 4 + 3 + 's';
            const colors = ['#800020', '#e30b5c', '#ffb7c5', '#b03060'];
            petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.appendChild(petal);
            setTimeout(() => { petal.remove(); }, 7000);
        }
        setInterval(createPetal, 300);
    </script>
</body>
</html>
