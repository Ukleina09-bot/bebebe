<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для любимости</title>
    <style>
        body {
            background: radial-gradient(circle, #4b0000, #000000); 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        .shake-active { animation: shake 0.1s infinite; }
        @keyframes shake {
            0% { transform: translate(3px, 3px); }
            50% { transform: translate(-3px, -2px); }
            100% { transform: translate(3px, -2px); }
        }

        #chaos-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 2s ease;
            pointer-events: none;
        }

        .text {
            font-size: 50px;
            color: #ff2d55;
            font-weight: bold;
            text-align: center;
            animation: attack 1.5s infinite ease-in-out;
        }

        @keyframes attack {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(3) rotate(-60deg); }
            50% { transform: scale(1) rotate(0deg); }
            75% { transform: scale(3) rotate(60deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .sticker { position: absolute; font-size: 30px; animation: fly 2s linear infinite; }
        @keyframes fly {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        #runBtn {
            opacity: 0;
            visibility: hidden;
            padding: 15px 30px;
            font-size: 20px;
            background-color: #ff0055;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: absolute;
            transition: all 0.4s ease; /* Сделали движение плавным */
            z-index: 100;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            touch-action: none;
        }

        .show-btn { opacity: 1 !important; visibility: visible !important; }
    </style>
</head>
<body id="mainBody" class="shake-active">

    <div id="chaos-container">
        <div class="text">ты мой мир ♥️</div>
    </div>

    <button id="runBtn">хочу поцелуев</button>

    <script>
        const body = document.getElementById('mainBody');
        const chaos = document.getElementById('chaos-container');
        const btn = document.getElementById('runBtn');

        let jumpCount = 0; // Считаем прыжки

        function createSticker() {
            const stickers = ['❤️', '💖', '💋', '💝', '✨'];
            const s = document.createElement('div');
            s.className = 'sticker';
            s.innerText = stickers[Math.floor(Math.random() * stickers.length)];
            s.style.left = Math.random() * 100 + 'vw';
            s.style.fontSize = Math.random() * 30 + 20 + 'px';
            s.style.animationDuration = Math.random() * 1 + 1 + 's';
            chaos.appendChild(s);
            setTimeout(() => s.remove(), 2000);
        }

        const stickerInterval = setInterval(createSticker, 150);

        setTimeout(() => {
            clearInterval(stickerInterval);
            chaos.style.opacity = '0';
            body.classList.remove('shake-active');
            setTimeout(() => {
                btn.classList.add('show-btn');
                centerButton();
            }, 1000);
        }, 5000);

        function centerButton() {
            btn.style.left = (window.innerWidth / 2 - btn.clientWidth / 2) + 'px';
            btn.style.top = (window.innerHeight / 2 - btn.clientHeight / 2) + 'px';
        }

        function moveButton() {
            if (jumpCount < 10) { // После 10 раз кнопка перестанет убегать
                const x = Math.random() * (window.innerWidth - btn.clientWidth);
                const y = Math.random() * (window.innerHeight - btn.clientHeight);
                btn.style.left = x + 'px';
                btn.style.top = y + 'px';
                jumpCount++;
            }
        }

        btn.addEventListener('touchstart', (e) => {
            if (jumpCount < 10) {
                e.preventDefault();
                moveButton();
            }
        });
        btn.addEventListener('mouseover', () => {
            if (jumpCount < 10) moveButton();
        });

        btn.addEventListener('click', () => {
            alert('Ну наконец-то поймала! С тебя миллион поцелуев! 💋');
        });
    </script>
</body>
