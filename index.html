<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tochnonecawa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #4a0404 0%, #1a0101 100%);
            color: #ffb7c5;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            text-align: center;
        }
        .content {
            z-index: 10;
            background: rgba(0, 0, 0, 0.65);
            padding: 40px 20px;
            border-radius: 25px;
            border: 1px solid #e30b5c;
            box-shadow: 0 0 40px rgba(227, 11, 92, 0.4);
            backdrop-filter: blur(12px);
            width: 80%;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ff2d55;
            text-shadow: 0 0 15px rgba(255, 45, 85, 0.6);
        }
        p {
            font-size: 1.2rem;
            font-style: italic;
            color: #ffb7c5;
            margin: 5px 0;
            opacity: 0.9;
        }
        .petal {
            position: absolute;
            top: -10%;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 1;
            /* Сами лепестки */
            background-image: url('https://www.transparentpng.com/download/sakura-base/flower-petals-falling-cherry-blossoms-png-4.png');
            background-size: contain;
            background-repeat: no-repeat;
        }
        @keyframes fall {
            0% { transform: translateY(0vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Tochnonecawa</h1>
        <p>сайт для бусинки</p>
        <p style="font-size: 0.8rem; margin-top: 20px; opacity: 0.5;">est. 67</p>
    </div>
    <script>
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            // Делаем разные размеры лепестков
            const size = Math.random() * 15 + 10 + 'px';
            petal.style.width = size;
            petal.style.height = size;
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 4 + 5 + 's';
            petal.style.opacity = Math.random() * 0.6 + 0.4;
            document.body.appendChild(petal);
            setTimeout(() => { petal.remove(); }, 9000);
        }
        setInterval(createPetal, 200); // Чтобы летели почаще и красиво
    </script>
</body>
</html>
